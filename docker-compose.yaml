services:
  model-downloader:
    image: python:3.12-slim
    volumes:
      - model-data:/models
    command:
      - bash
      - -c
      - |
        pip install --no-cache-dir huggingface_hub &&
        if [ ! -f /models/sd_turbo.safetensors ]; then
          hf download stabilityai/sd-turbo \
            sd_turbo.safetensors \
            --revision b261bac6fd2cf515557d5d0707481eafa0485ec2 \
            --local-dir /models;
        fi

  laf-inference:
    restart: unless-stopped
    image: ghcr.io/fabriciojm/laf-inference:v0.1.1
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /models/sd_turbo.safetensors
      OUTPUT_DIR: /output
    volumes:
      - model-data:/models
      - output-data:/output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  model-data:
  output-data:
